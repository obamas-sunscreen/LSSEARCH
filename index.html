<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Law School Shortlist Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Permanent+Marker&display=swap" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brandBtn" type="button" aria-label="Back to Find your fit">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name">Law School Shortlist</span>
        <span class="brand-sub" id="brandSub">Loading…</span>
      </span>
    </button>

    <div class="topbar-actions">
      <button class="tbtn tbtn-search" id="searchBtn" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/></svg>
        <span class="tbtn-label">Search</span>
        <kbd>/</kbd>
      </button>
      <div class="menu" id="menu">
        <button class="tbtn" id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menuList">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h10"/></svg>
          <span class="tbtn-label">Menu</span>
          <span class="cnt" id="menuCount" hidden>0</span>
        </button>
        <div class="menu-list" id="menuList" role="menu">
          <button type="button" role="menuitem" data-nav="fit">Find your fit</button>
          <button type="button" role="menuitem" data-nav="results" id="menuResults">Your schools</button>
          <button type="button" role="menuitem" data-nav="map">Explore by state</button>
          <button type="button" role="menuitem" id="listBtn">My saved list <span class="cnt" id="listCount">0</span></button>
        </div>
      </div>
    </div>
  </header>

  <main id="app"><div class="view"><p class="loading">Loading data…</p></div></main>

  <!-- saved-list drawer -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="My target list" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <h2>My target list</h2>
        <p id="drawerSub">Saved schools, grouped by state.</p>
      </div>
      <button class="iconbtn" id="drawerClose" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot">
      <button class="ghostbtn" id="exportMd" type="button">Export Markdown</button>
      <button class="ghostbtn" id="exportCsv" type="button">Export CSV</button>
    </div>
  </aside>

  <!-- search palette -->
  <div class="search-scrim" id="searchScrim" role="dialog" aria-modal="true" aria-label="Search schools and states">
    <div class="search-box">
      <div class="search-field">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/></svg>
        <input id="searchInput" type="text" placeholder="Search schools and states…"
               autocomplete="off" spellcheck="false" aria-controls="searchResults" />
        <button class="iconbtn" id="searchClose" type="button" aria-label="Close search">esc</button>
      </div>
      <div class="search-results" id="searchResults" role="listbox"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
