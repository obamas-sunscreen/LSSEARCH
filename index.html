<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Law School Shortlist Builder</title>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --ink: #1c2530;
    --ink-soft: #5a6672;
    --ink-faint: #8a95a1;
    --line: #e3e7ec;
    --line-strong: #cdd4dc;
    --accent: #2d5f6b;
    --accent-deep: #1a4048;
    --gray-state: #e4e8ec;
    --gray-state-stroke: #cfd6dc;
    --shadow: 0 1px 3px rgba(20,30,40,.06), 0 8px 24px rgba(20,30,40,.06);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font-family: inherit; }

  header.topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    padding: 16px 28px;
    background: rgba(247,248,250,.9);
    backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; flex-direction: column; }
  .brand h1 {
    margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.01em;
  }
  .brand .sub { font-size: 12.5px; color: var(--ink-faint); }

  .listbtn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px;
    background: var(--ink);
    color: #fff;
    border: none; border-radius: 999px;
    font-size: 13.5px; font-weight: 550;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .listbtn:hover { background: #33414f; }
  .listbtn:active { transform: translateY(1px); }
  .listbtn .cnt {
    background: rgba(255,255,255,.2);
    border-radius: 999px; padding: 1px 8px; font-size: 12px;
    min-width: 20px; text-align: center;
  }

  main { max-width: 1080px; margin: 0 auto; padding: 24px 28px 80px; }

  .view { animation: fade .2s ease; }
  @keyframes fade { from { opacity: .55; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* breadcrumb */
  .crumb { font-size: 13.5px; color: var(--ink-faint); margin-bottom: 20px; }
  .crumb .link { color: var(--accent); cursor: pointer; font-weight: 500; }
  .crumb .link:hover { text-decoration: underline; }
  .crumb .sep { margin: 0 8px; color: var(--line-strong); }
  .crumb .cur { color: var(--ink); font-weight: 550; }

  /* map view — profile card sits where the intro copy used to */
  .profile {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px 22px;
  }
  .profile h2 { margin: 0 0 3px; font-size: 20px; letter-spacing: -.015em; }
  .profile .lede { margin: 0 0 18px; color: var(--ink-soft); font-size: 13.5px; }
  /* min() so the track can shrink below 320px on a narrow phone instead of overflowing */
  .pf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 22px 30px; }
  .pf-field > label, .pf-legend { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); font-weight: 650; margin-bottom: 7px; }
  .pf-hint { font-size: 12px; color: var(--ink-faint); margin: 7px 0 0; }

  .pf-scores { display: flex; gap: 10px; flex-wrap: wrap; }
  /* min-width:0 so the inputs shrink inside the flex row instead of overflowing it */
  .pf-scores > div { flex: 1 1 140px; min-width: 0; }
  .pf-num input, .pf-pick select, .pf-add input {
    width: 100%; min-width: 0; padding: 9px 11px; font-family: inherit; font-size: 14.5px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line-strong); border-radius: 8px;
    font-variant-numeric: tabular-nums;
  }
  .pf-num input:focus, .pf-pick select:focus, .pf-add input:focus {
    outline: none; border-color: var(--accent); background: var(--panel);
  }
  .pf-num input.bad { border-color: #d98a90; background: #fdf3f3; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    padding: 6px 12px; font-family: inherit; font-size: 13px; font-weight: 500;
    background: var(--bg); color: var(--ink-soft);
    border: 1px solid var(--line-strong); border-radius: 999px; cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip.on { background: #e4eef0; border-color: var(--accent); color: var(--accent-deep); font-weight: 600; }
  .chip.top { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .chip.rm { font-size: 12.5px; }
  .chip.rm::after { content: " ×"; color: var(--ink-faint); font-weight: 600; }
  .chip.rm:hover::after { color: #b23a44; }
  .chip.region { border-style: dashed; font-size: 12.5px; }

  .sliders { display: flex; flex-direction: column; gap: 9px; }
  .sl-row { display: flex; align-items: center; gap: 12px; font-size: 13.5px; color: var(--ink-soft); }
  .sl-row > span:first-child { width: 108px; flex: none; }
  .sl-row input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; min-width: 0; }
  .sl-row .sl-val { width: 62px; text-align: right; font-size: 12px; color: var(--ink-faint); flex: none; }

  .pf-actions { display: flex; align-items: center; gap: 12px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .pf-go {
    padding: 11px 22px; font-family: inherit; font-size: 14.5px; font-weight: 600;
    background: var(--accent); color: #fff; border: none; border-radius: 9px; cursor: pointer;
    transition: background .15s ease, transform .08s ease;
  }
  .pf-go:hover { background: var(--accent-deep); }
  .pf-go:active { transform: translateY(1px); }
  .pf-go:disabled { background: var(--line-strong); cursor: not-allowed; }
  .pf-reset { background: none; border: none; color: var(--ink-faint); font-family: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; }
  .pf-reset:hover { color: var(--ink); }
  .pf-status { font-size: 12.5px; color: var(--ink-faint); }

  /* results */
  .res-head { margin-bottom: 18px; }
  .res-head h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.015em; }
  .res-head p { margin: 0; color: var(--ink-soft); font-size: 13.5px; }
  .band { margin-bottom: 30px; }
  .band-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 4px; }
  .band-h h3 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
  .band-h .n { font-size: 12.5px; color: var(--ink-faint); }
  .band-sub { margin: 0 0 12px; font-size: 12.5px; color: var(--ink-faint); }
  .band-more { margin-top: 10px; background: none; border: 1px dashed var(--line-strong); border-radius: 8px; padding: 9px 14px; width: 100%; font-family: inherit; font-size: 13px; color: var(--ink-soft); cursor: pointer; }
  .band-more:hover { border-color: var(--accent); color: var(--accent); }

  .rrow {
    display: flex; align-items: center; gap: 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow);
    transition: border-color .12s ease, transform .08s ease;
  }
  .rrow:hover { border-color: var(--line-strong); transform: translateX(2px); }
  .rrow .rmain { flex: 1 1 auto; min-width: 0; }
  .rrow .rname { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .rrow .rloc { font-size: 12.5px; color: var(--ink-faint); }
  .rrow .rwhy { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; }
  .rrow .rwhy b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .subs { display: flex; gap: 16px; flex: 0 0 auto; }
  .sub { text-align: center; min-width: 78px; }
  .sub .sv { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .sub .sl { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); font-weight: 600; margin-top: 1px; }
  /* Compact echo of the .pcttrack read on the school page: shaded 25th–75th
     band, tick for where the applicant's own number falls. */
  .sub .strack { height: 6px; border-radius: 4px; background: #e6ebed; margin-top: 6px; position: relative; }
  .sub .strack > i { position: absolute; top: 0; bottom: 0; left: 25%; right: 25%; background: #c2d3d7; border-radius: 2px; }
  .sub .strack > b { position: absolute; top: -2px; width: 3px; height: 10px; margin-left: -1.5px; border-radius: 2px; background: var(--accent-deep); }
  .sub .sdiff { font-size: 10.5px; font-weight: 600; margin-top: 4px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .sub .sdiff.up { color: #2f6b47; }
  .sub .sdiff.dn { color: #9a6414; }

  /* outcomes block on school detail */
  .outcomes { margin-top: 22px; }
  /* Four across so the eight outcome tiles always fill two complete rows. */
  .oc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .oc { background: var(--panel); padding: 12px 14px; }
  .oc .ov { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .oc .ol { font-size: 11px; color: var(--ink-faint); margin-top: 1px; }
  .oc .op { font-size: 10.5px; color: var(--accent); font-weight: 600; margin-top: 2px; }
  .feeds { font-size: 13.5px; color: var(--ink-soft); margin-top: 12px; }
  .feeds b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .odds {
    margin-top: 20px; padding: 16px 18px; border-radius: 12px;
    background: var(--bg); border: 1px solid var(--line); max-width: 560px;
  }
  .odds .oh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .odds .oband { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  .odds .od { font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
  .odds .od b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .pctline { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-soft); margin-top: 9px; }
  .pctline > span:first-child { width: 46px; flex: none; }
  .pcttrack { flex: 1; height: 8px; background: #dfe5e8; border-radius: 5px; position: relative; }
  .pcttrack > i { position: absolute; top: 0; bottom: 0; left: 25%; right: 25%; background: #c2d3d7; border-radius: 2px; }
  .pcttrack > b { position: absolute; top: -3px; width: 3px; height: 14px; border-radius: 2px; background: var(--accent-deep); }

  /* Admit / waitlist / deny split. The waitlist segment is hatched on purpose:
     the ABA publishes no waitlist figures, so that slice is a modelled band and
     shouldn't be read with the same confidence as the other two. */
  .obar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: #dfe5e8; margin-top: 14px; }
  .obar > span { display: block; height: 100%; }
  .obar .oa { background: var(--accent-deep); }
  .obar .ow { background: repeating-linear-gradient(135deg, #aebbc1 0 4px, #d4dde0 4px 8px); }
  .obar .odn { background: #dfe5e8; }
  .okeys { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
  .okey { font-size: 12.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
  .okey i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .okey b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 650; }
  .okey .ka { background: var(--accent-deep); }
  .okey .kw { background: repeating-linear-gradient(135deg, #aebbc1 0 3px, #d4dde0 3px 6px); }
  .okey .kd { background: #dfe5e8; }
  .omodel { font-size: 12px; color: var(--ink-faint); margin-top: 6px; }
  .oflag { font-size: 12.5px; color: #9a6414; margin-top: 8px; }

  /* The same read, compact, one per result row: band and probability as a
     single element so the two can never tell you different stories. */
  .pchip { flex: 0 0 auto; text-align: right; min-width: 98px; }
  .pchip .pcv { font-size: 19px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .pchip .pcl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; font-weight: 650; }
  .pchip .pcs { font-size: 10.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-top: 3px; }

  .band-safety { color: #2f6b47; }
  .band-target { color: var(--accent-deep); }
  .band-reach  { color: #9a6414; }
  .band-far    { color: #a1444c; }

  .mapwrap {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 8px; margin-top: 18px;
  }
  svg.usmap { width: 100%; height: auto; display: block; }
  svg.usmap path.live { cursor: pointer; transition: fill .12s ease, stroke .12s ease; stroke: #fff; stroke-width: .9; }
  svg.usmap path.live:hover { stroke: var(--ink); stroke-width: 1.6; }
  svg.usmap path.dead { fill: var(--gray-state); stroke: var(--gray-state-stroke); stroke-width: .8; pointer-events: none; }
  svg.usmap line.callout-line { stroke: var(--line-strong); stroke-width: 1; pointer-events: none; }
  svg.usmap g.callout { cursor: pointer; }
  svg.usmap g.callout circle { stroke: #fff; stroke-width: 1.4; transition: stroke .12s ease; }
  svg.usmap g.callout:hover circle { stroke: var(--ink); stroke-width: 2; }
  svg.usmap g.callout text {
    font-family: inherit; font-size: 10px; font-weight: 700; fill: #fff;
    text-anchor: middle; pointer-events: none; letter-spacing: .02em;
  }

  .maplegend {
    display: flex; flex-wrap: wrap; align-items: center; gap: 18px;
    margin-top: 16px; font-size: 12.5px; color: var(--ink-soft);
  }
  .ramp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rampbar { width: 160px; height: 12px; border-radius: 6px; border: 1px solid var(--line); }
  .ramp .lo, .ramp .hi { font-size: 11.5px; color: var(--ink-faint); }

  /* tooltip */
  #tooltip {
    position: fixed; z-index: 100; pointer-events: none;
    background: var(--ink); color: #fff;
    padding: 10px 12px; border-radius: 8px; font-size: 12.5px;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
    opacity: 0; transition: opacity .1s ease; max-width: 240px;
  }
  #tooltip.on { opacity: 1; }
  #tooltip .tt-name { font-weight: 650; margin-bottom: 5px; font-size: 13.5px; }
  #tooltip .tt-row { display: flex; justify-content: space-between; gap: 16px; color: #cfd6dc; }
  #tooltip .tt-row b { color: #fff; font-variant-numeric: tabular-nums; }

  /* state detail */
  .factor-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 20px 0 28px; }
  .fcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .fcard h3 { margin: 0 0 4px; font-size: 14px; letter-spacing: .01em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
  .fscore { font-size: 30px; font-weight: 680; letter-spacing: -.02em; line-height: 1; }
  .fscore span { font-size: 15px; font-weight: 500; color: var(--ink-faint); }
  .fbar { height: 7px; background: var(--line); border-radius: 4px; margin: 12px 0 14px; overflow: hidden; }
  .fbar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .fdetail { font-size: 13px; color: var(--ink-soft); }
  .fdetail .drow { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .fdetail .drow:last-child { border-bottom: none; }
  .fdetail .drow b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 550; }
  .anchor-note { font-size: 12px; color: var(--ink-faint); margin-top: 10px; }

  .section-h { font-size: 16px; font-weight: 620; margin: 8px 0 14px; letter-spacing: -.01em; }

  /* school list rows */
  .school-list { display: flex; flex-direction: column; gap: 8px; }
  .srow {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; cursor: pointer; box-shadow: var(--shadow);
    transition: border-color .12s ease, transform .08s ease;
  }
  .srow:hover { border-color: var(--line-strong); transform: translateX(2px); }
  .srow .sname { flex: 1 1 auto; min-width: 0; }
  .srow .sname .n { font-weight: 600; font-size: 15px; }
  .srow .sname .c { font-size: 12.5px; color: var(--ink-faint); }
  .srow .stats { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .srow .stats b { color: var(--ink); font-weight: 600; }
  .saved-flag { font-size: 12px; color: var(--accent); font-weight: 600; white-space: nowrap; }

  /* tier badges */
  .tier {
    display: inline-block; font-size: 11px; font-weight: 650; letter-spacing: .02em;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    border: 1px solid transparent;
  }
  .tier-1 { background: #1a4048; color: #fff; }              /* T14 */
  .tier-2 { background: #2d5f6b; color: #fff; }              /* T20 */
  .tier-3 { background: #4a7f8a; color: #fff; }              /* T30 */
  .tier-4 { background: #cfe0e3; color: #204049; }          /* T50 */
  .tier-5 { background: #dde8ea; color: #35555c; }           /* T60-100 */
  .tier-6 { background: #eef1f2; color: #5a6672; border-color: var(--line); } /* Regional */

  /* school detail */
  .school-hero { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 26px; }
  .school-hero .h-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .school-hero h2 { margin: 0 0 4px; font-size: 24px; letter-spacing: -.02em; }
  .school-hero .loc { color: var(--ink-soft); font-size: 14px; }
  .statblock { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 24px 0; }
  .stat { background: var(--panel); padding: 16px 18px; }
  .stat .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); font-weight: 600; }
  .stat .val { font-size: 21px; font-weight: 650; margin-top: 4px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .stat .rng { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .writeup-h { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); font-weight: 600; margin: 4px 0 8px; }
  .writeup { font-size: 15.5px; line-height: 1.62; color: var(--ink); max-width: 660px; }

  .lifestyle { margin-top: 22px; padding: 18px 20px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; max-width: 560px; }
  .life-head { display: flex; align-items: center; justify-content: space-between; }
  .life-score { font-size: 26px; font-weight: 700; letter-spacing: -.02em; color: var(--accent-deep, #0f333a); font-variant-numeric: tabular-nums; }
  .life-score span { font-size: 14px; font-weight: 500; color: var(--ink-faint); }
  .life-sub { font-size: 12.5px; color: var(--ink-faint); margin: 2px 0 14px; }
  .life-row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--ink-soft); margin: 7px 0; }
  .life-row > span:first-child { width: 92px; flex: none; }
  .life-row b { width: 30px; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  .life-track { flex: 1; height: 7px; background: #d7e0e2; border-radius: 4px; overflow: hidden; }
  .life-fill { display: block; height: 100%; background: linear-gradient(90deg, #4a7f8a, #0f333a); border-radius: 4px; }

  .addbtn {
    margin-top: 24px; display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 24px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: #fff; border: none; border-radius: 10px; cursor: pointer;
    transition: background .15s ease, transform .08s ease;
  }
  .addbtn:hover { background: var(--accent-deep); }
  .addbtn:active { transform: translateY(1px); }
  .addbtn.added { background: var(--panel); color: var(--accent); border: 1.5px solid var(--accent); }

  /* list panel */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,28,36,.4); z-index: 200;
    opacity: 0; pointer-events: none; transition: opacity .22s ease;
  }
  .overlay.on { opacity: 1; pointer-events: auto; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 92vw; z-index: 210;
    background: var(--panel); box-shadow: -8px 0 30px rgba(20,30,40,.16);
    transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column;
  }
  .panel.on { transform: none; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .panel-close { background: none; border: none; font-size: 22px; color: var(--ink-faint); cursor: pointer; line-height: 1; padding: 4px 8px; border-radius: 6px; }
  .panel-close:hover { background: var(--bg); color: var(--ink); }
  .panel-body { flex: 1 1 auto; overflow-y: auto; padding: 18px 22px; }
  .panel-actions { padding: 16px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .exportbtn { flex: 1; padding: 11px; font-size: 13.5px; font-weight: 550; background: var(--bg); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 8px; cursor: pointer; }
  .exportbtn:hover { background: #eef1f4; }
  .exportbtn:disabled { opacity: .5; cursor: not-allowed; }

  .pl-state { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); font-weight: 700; margin: 18px 0 8px; }
  .pl-state:first-child { margin-top: 0; }
  .pl-entry { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .pl-entry .pe-main { flex: 1 1 auto; cursor: pointer; min-width: 0; }
  .pl-entry .pe-main .n { font-weight: 600; font-size: 14px; }
  .pl-entry .pe-main .n:hover { color: var(--accent); }
  .pl-entry .pe-main .m { font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .pl-remove { background: none; border: 1px solid var(--line); color: var(--ink-faint); width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 15px; line-height: 1; flex: 0 0 auto; }
  .pl-remove:hover { background: #fbeced; border-color: #e5b6ba; color: #b23a44; }
  .empty { text-align: center; color: var(--ink-faint); padding: 48px 20px; font-size: 14px; }

  .errbox { background: #fdecec; border: 1px solid #f3bcbc; color: #9c2a2a; padding: 16px 18px; border-radius: 10px; font-size: 14px; }

  @media (max-width: 720px) {
    .factor-grid, .statblock { grid-template-columns: 1fr; }
    .oc-grid { grid-template-columns: repeat(2, 1fr); }
    .subs { display: none; }               /* result rows keep the name + why line */
    .pchip { min-width: 80px; }            /* but the odds stay — they're the point */
    .pchip .pcv { font-size: 17px; }
    .rrow { gap: 10px; }
    main { padding: 18px 16px 60px; }
    header.topbar { padding: 14px 16px; }
  }
</style>
