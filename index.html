<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Law School Shortlist Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Permanent+Marker&display=swap" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- Cloned into the top of the landing page. -->
  <template id="logoTpl"><a class="logo" href="./" aria-label="Lssearch, home"><svg viewBox="0 0 140 40" aria-hidden="true">
    <path d="M7 5.5c-1 9-.8 18.5 0 28.5 4-.8 8-.6 12.2.6"/>
    <path d="M20.8 30.8c5.2 5.2 14 2.6 13.4-5C33.6 19 23.6 18 23.4 12 23.2 7 27.6 4.6 33 4.6c26 0 62-.8 91-.9 4 0 7-.6 9.5-2.2"/>
    <path d="M50.5 19.5c-4-3-10.5-1.5-9.5 2.8s9.6 3.2 9.4 8.2c-.2 4.6-7 5-10.4 1.6"/>
    <path d="M55.5 25.5c5 .8 10.5-.2 10.5-3.8 0-4.4-9.2-4.6-10.4 1.8-1.2 6.4 4 11.6 11.4 8"/>
    <path d="M82 20.5c-4-3.8-11.6-1.4-11.4 5.6.2 7.2 7.4 8.4 11.2 2.2M81.6 18c.2 6 0 11.5 1.8 16.8"/>
    <path d="M89 17.5c.4 6 .2 11.2-.4 16.5M88.8 24.5c2-5.4 5.4-7 9.6-5.6"/>
    <path d="M112.5 19.8c-4.4-3.4-11.6-.8-11.4 6.2.2 7.4 6.8 9 12.4 4.6"/>
    <path d="M118.6 9.5c-.4 8.4-.2 16.4.2 25M118.6 25.5c2.4-6.4 10.4-7.4 10.2-1.2 0 4 .2 7.2 1 10.4"/>
  </svg></a></template>

  <div class="menu" id="menu">
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menuList">
      <svg viewBox="0 0 32 26" aria-hidden="true">
        <path d="M3 4.5c8-.9 17-.6 26 .3"/><path d="M4 13c7.5.6 16 .2 24.5-.5"/><path d="M3 21.6c9-.7 17.5-.3 26 .5"/>
      </svg>
      <span class="cnt" id="menuCount" hidden>0</span>
    </button>
    <div class="menu-list" id="menuList" role="menu">
      <button type="button" role="menuitem" data-nav="fit">Find your fit</button>
      <button type="button" role="menuitem" data-nav="results" id="menuResults">Your schools</button>
      <button type="button" role="menuitem" data-nav="map">Explore by state</button>
      <button type="button" role="menuitem" data-nav="list">My saved list</button>
      <button type="button" role="menuitem" data-nav="about">About</button>
    </div>
  </div>

  <main id="app"><div class="view"><p class="loading">Loading data…</p></div></main>

  <script src="app.js"></script>
</body>
</html>
